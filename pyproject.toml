[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "game-trans"
version = "0.0.1"
description = "Real-time game voice caption & translation overlay powered by the Gemini API (Google AI Studio)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",          # Qt Quick overlay UI
  "qasync>=0.27",          # asyncio <-> Qt event loop
  "google-genai>=1.40",    # Gemini API SDK
  "keyring>=25",           # API key in Windows Credential Manager
  "numpy>=2.0",
  "sounddevice>=0.5",      # audio output to virtual cable
  "proc-tap>=1.1",         # WASAPI per-process loopback capture (Windows 10/11)
  "PyAudioWPatch>=0.2.12", # WASAPI loopback fallback
  "onnxruntime>=1.20",     # Silero VAD
  "psutil>=6.0",           # game process detection (listing only)
  "edge-tts>=7.0",         # default free TTS
  "miniaudio>=1.61",       # in-memory MP3 -> PCM16 decoding (no ffmpeg required)
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
game-trans = "game_trans.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_trans"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
